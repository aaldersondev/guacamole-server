#
# Builds the guacd container image and publishes it to the GitHub Container
# Registry, so that using this fork does not require building it.
#

name: Publish guacd image

on:
  push:
    branches:
      - faster-display
    paths-ignore:
      - '**.md'
  workflow_dispatch:

# Only one publish at a time, and let an in-progress build finish rather than
# cancelling it: these builds take a while
concurrency:
  group: publish-guacd
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:

  publish:
    name: Build and push to ghcr.io
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:

      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/guacd
          tags: |
            type=raw,value=1.6.0-fast
            type=raw,value=latest
            type=sha,prefix=1.6.0-fast-,format=short
          labels: |
            org.opencontainers.image.title=guacd (faster display pipeline)
            org.opencontainers.image.description=Apache Guacamole 1.6.0 guacd with a reduced-CPU display pipeline

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
